server {
    listen 80;
    
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # Use Docker's internal DNS resolver to handle startup race conditions
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        # Using a variable forces re-resolution of the DNS name
        set $upstream_backend http://backend:8001;
        
        # Rewrite the URL to remove /api/ prefix before forwarding if your backend doesn't expect it
        # If your backend expects /api/, remove the rewrite line. 
        # Based on previous context, standard FastAPIs often mount routes at root, so we rewrite.
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass $upstream_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
